[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=9.0.3",
    # Keep in lockstep with the rev pinned in .pre-commit-config.yaml.
    "ruff>=0.15.12",
]

[tool.uv.sources]
ds2hf = { workspace = true }
ds2hf-pipeline = { workspace = true }

# Default workspace install pulls in both members so `uv sync` at the repo
# root gets a fully-functional dev environment (consumer types + producer
# CLI) without needing to specify --package per command.
[tool.uv]
default-groups = ["dev"]

# Tooling config shared across both packages.
[tool.pytest.ini_options]
markers = [
    "network: tests that hit the live GDC API (deselect with '-m \"not network\"')",
    "integration: tests that read locally built parquets under $HOME/data/tcga2hf/processed (deselect with '-m \"not integration\"')",
]
testpaths = [
    "packages/ds2hf/tests",
    "packages/ds2hf-pipeline/tests",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# E501 measures source lines, which is the wrong question for two places
# where the "code" is really prose. Neither is a style concession: wrapping
# the lines would corrupt the output.
[tool.ruff.lint.per-file-ignores]
# The dataset cards are markdown held in f-strings. A markdown table row
# cannot be split across source lines without ceasing to be a table row,
# and the rendered card is what readers see, not this file.
"packages/ds2hf-pipeline/src/ds2hf_pipeline/tcga/dataset_card.py" = ["E501"]
"packages/ds2hf-pipeline/src/ds2hf_pipeline/mskchord/card.py" = ["E501"]
# The Liu 2018 research scripts are narrative: long prose strings and wide
# printed tables, written to be read as a report rather than maintained as
# a library. They still get F/B/I/UP, which catch real defects.
"dev_research/**/*.py" = ["E501"]
