[project]
name = "mskchord2hf-pipeline"
version = "0.1.0"
description = "Build pipeline that mirrors the MSK-CHORD cBioPortal study onto the HuggingFace Hub, format conversion only."
readme = "README.md"
authors = [
    { name = "Gabriel Altay", email = "gabriel.altay@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=1.13.0",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "typer>=0.25.1",
]

[project.scripts]
mskchord2hf-pipeline = "mskchord2hf_pipeline.cli:app"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
