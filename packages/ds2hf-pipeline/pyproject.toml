[project]
name = "ds2hf-pipeline"
version = "0.1.0"
description = "Build pipelines that publish public cancer datasets (TCGA from the NCI GDC, MSK-CHORD from cBioPortal) to the HuggingFace Hub."
readme = "README.md"
authors = [
    { name = "Gabriel Altay", email = "gabriel.altay@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ds2hf",
    "httpx>=0.28.1",
    "huggingface-hub>=1.13.0",
    "openpyxl>=3.1",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "typer>=0.25.1",
]

[project.optional-dependencies]
# Reporting: standalone HTML render of dev_research/<paper>/sections/*.md
# into <paper>/report.html. Pulls in python-markdown for the conversion;
# everything else (CSS, sortable-table JS) is inlined into the output so
# the report.html file is fully self-contained.
report = [
    "markdown>=3.7",
]

[project.scripts]
ds2hf-pipeline = "ds2hf_pipeline.cli:app"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
