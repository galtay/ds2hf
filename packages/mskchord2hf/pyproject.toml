[project]
name = "mskchord2hf"
version = "0.1.0"
description = "Local loader for the gabrielaltay/msk-chord-2024 HuggingFace dataset: per-patient views built on your machine."
readme = "README.md"
authors = [
    { name = "Gabriel Altay", email = "gabriel.altay@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.13.0",
    "pyarrow>=24.0.0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
